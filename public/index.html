<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Duvan — Conversor a PDF</title>

  <!-- React & ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --accent: #ffffff;
      --success: #88cc88;
      --error: #cc8888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 520px; padding: 2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      padding: 2rem;
      width: 100%;
    }
    .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: background .2s; margin-bottom: 1rem; }
    .drop-zone:hover, .drop-zone.dragover { background: var(--border); }
    .drop-zone.dragover { border-color: var(--accent); }
    .icon { width: 64px; height: 64px; background: var(--card); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 32px; }
    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom .5rem; }
    p { font-size: .9rem; color: var(--muted); margin-bottom 1rem; }
    .file-name { margin-top .5rem; font-size: .85rem; color: var(--text); }
    .btn { width: 100%; padding .8rem 1rem; background: var(--accent); color: var(--black); border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top .5rem; }
    .btn:disabled { background: #3a3a3a; color: var(--muted); cursor: not-allowed; }
    .status { margin-top 1rem; }
    .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { background: rgba(136, 204, 136, .08); border: 1px solid rgba(136,204,136,.25); padding: 1rem; border-radius: 12px; text-align: center; margin-top .5rem; display: none; color: var(--success); }
    .success.visible { display: block; }
    .error { background: rgba(204, 136, 136, .08); border: 1px solid rgba(204,136,136,.25); padding: 1rem; border-radius: 12px; text-align: center; margin-top .5rem; display: none; color: var(--error); }
    .error.visible { display: block; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f9f9f9; --card: #ffffff; --border: #e5e5e5; --text: #111; --muted: #666; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [file, setFile] = useState(null);
      const [converting, setConverting] = useState(false);
      const [message, setMessage] = useState({ type: null, text: '' });

      const handleFileChange = (e) => {
        const f = e.target.files[0];
        setFile(f);
        if (f) {
          setMessage({ type: null, text: '' });
          document.getElementById('fileName').textContent = f.name;
          document.getElementById('fileName').style.display = 'block';
          document.getElementById('convertBtn').disabled = false;
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const dt = e.dataTransfer;
        if (dt && dt.files.length) {
          handleFileChange({ target: { files: dt.files } });
        }
      };

      const handleConvert = async () => {
        if (!file) return;
        setConverting(true);
        setMessage({ type: null, text: '' });
        const formData = new FormData();
        formData.append('file', file);
        const btn = document.getElementById('convertBtn');
        btn.disabled = true;
        const status = document.getElementById('statusArea');
        status.innerHTML = '<div class="spinner"></div><p>Convirtiendo…</p>';

        try {
          const res = await fetch('/convert', { method: 'POST', body: formData });
          const data = await res.json();
          if (data.success) {
            setMessage({ type: 'success', text: 'PDF listo para descargar' });
            // Show download link after a short delay
            setTimeout(() => {
              const dlUrl = data.downloadUrl;
              const a = document.createElement('a');
              a.href = dlUrl;
              a.target = '_blank';
              a.download = data.fileName;
              a.style.display = 'block';
              a.style.marginTop = '.5rem';
              a.textContent = `⬇ Descargar ${data.fileName}`;
              status.appendChild(a);
            }, 500);
          } else {
            setMessage({ type: 'error', text: data.error || 'Error desconocido' });
            if (data.detail) {
              const detailDiv = document.createElement('div');
              detailDiv.style.marginTop = '.5rem';
              detailDiv.style.fontSize = '.85rem';
              detailDiv.textContent = data.detail;
              status.appendChild(detailDiv);
            }
          }
        } catch (err) {
          setMessage({ type: 'error', text: 'Error de conexión: ' + err.message });
        } finally {
          setConverting(false);
          document.getElementById('convertBtn').disabled = false;
        }
      };

      useEffect(() => {
        const dz = document.getElementById('dropZone');
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
        dz.addEventListener('drop', handleDrop);
        dz.addEventListener('click', () => document.getElementById('fileUpload').click());

        return () => {
          dz.removeEventListener('dragover', null);
          dz.removeEventListener('dragleave', null);
          dz.removeEventListener('drop', null);
          dz.removeEventListener('click', null);
        };
      }, []);

      return (
        <div>
          <div className="drop-zone" id="dropZone">
            <div className="icon">⬆</div>
            <h2>Suelta tu archivo aquí</h2>
            <p>o haz clic para explorar</p>
            <input type="file" id="fileUpload" accept=".docx,.doc,.odt,.txt,.rtf,.pptx,.xlsx,.html,.pdf" style={{display: 'none'}} onChange={e => handleFileChange(e)} />
            <div className="file-name" id="fileName" style={{display: 'none'}}></div>
          </div>

          <button className="btn" id="convertBtn" onClick={handleConvert} disabled>Convertir a PDF</button>

          <div className="status" id="statusArea"></div>

          {/* Message placeholders */}
          {message.type === 'success' && <div className="success visible" role="alert"><p>{message.text}</p></div>}
          {message.type === 'error' && <div className="error visible" role="alert"><p>{message.text}</p></div>}
        </div>
      );
    }

    // Render
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
